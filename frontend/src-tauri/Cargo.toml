[package]
name = "proagent"
version = "0.1.0"
description = "ProAgent - 智能协作工作台"
authors = ["Team 26S-27"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "proagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "proagent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.11", features = ["json"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
