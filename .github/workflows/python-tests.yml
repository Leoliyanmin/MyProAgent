name: Python Tests

on:
  push:
    branches: [main, integration]
    paths:
      - 'local_backend/**'
      - 'server_backend/**'
      - 'localagent/**'
      - 'pytest.ini'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main, integration]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx
          pip install pydantic-settings "passlib[bcrypt]==1.7.4" python-jose cryptography
          pip install beautifulsoup4 apscheduler jieba
          pip install fastapi uvicorn sqlalchemy
          # Install bcrypt compatible version for passlib
          pip install "bcrypt==4.0.1"

      - name: Run local_backend tests
        run: |
          python -m pytest local_backend/tests/ -v --tb=short

      - name: Run server_backend tests
        run: |
          python -m pytest server_backend/tests/ -v --tb=short
