name: CI/CD Pipeline

on:
  push:
    branches: [main, integration, integration_mac]
  pull_request:
    branches: [main, integration, integration_mac]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 阶段一：编译 (Compile)
  # ============================================================

  compile-local:
    name: Compile Local Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_backend/requirements.txt

      - name: Compile check (syntax)
        run: python -m compileall local_backend/

  compile-server:
    name: Compile Server Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_backend/requirements.txt

      - name: Compile check (syntax)
        run: python -m compileall server_backend/

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # 阶段二：测试 (Test)
  # ============================================================

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 local_backend/ server_backend/ --count --max-line-length=120 --statistics --exit-zero

  test-local:
    name: Test Local Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest local_backend/tests/ -v --tb=short \
            --cov=local_backend \
            --cov-report=xml:coverage-local.xml \
            --cov-report=html:coverage-local-html

      - name: Upload coverage XML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-local
          path: coverage-local.xml
          retention-days: 7

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-local-html
          path: coverage-local-html/
          retention-days: 7

  test-server:
    name: Test Server Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server_backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest server_backend/tests/ -v --tb=short \
            --cov=server_backend \
            --cov-report=xml:coverage-server.xml \
            --cov-report=html:coverage-server-html

      - name: Upload coverage XML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: coverage-server.xml
          retention-days: 7

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server-html
          path: coverage-server-html/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm run test

  # ============================================================
  # 阶段三：打包 (Package)
  # ============================================================

  package-local:
    name: Package Local (Frontend + Local Backend)
    runs-on: ubuntu-latest
    needs: [compile-local, build-frontend, test-local, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Set version
        id: version
        run: echo "VERSION=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create package directory
        run: |
          mkdir -p pkg/proagent-local-${{ steps.version.outputs.VERSION }}
          cp -r local_backend pkg/proagent-local-${{ steps.version.outputs.VERSION }}/
          cp -r frontend/dist pkg/proagent-local-${{ steps.version.outputs.VERSION }}/frontend-dist
          cp -r localagent pkg/proagent-local-${{ steps.version.outputs.VERSION }}/
          cp -r personality pkg/proagent-local-${{ steps.version.outputs.VERSION }}/
          cp logging_config.py pkg/proagent-local-${{ steps.version.outputs.VERSION }}/
          cp scripts/start-local.sh pkg/proagent-local-${{ steps.version.outputs.VERSION }}/start.sh
          cp scripts/start-local.bat pkg/proagent-local-${{ steps.version.outputs.VERSION }}/start.bat
          cp local_backend/requirements.txt pkg/proagent-local-${{ steps.version.outputs.VERSION }}/

      - name: Create zip artifact
        run: |
          cd pkg
          zip -r proagent-local-${{ steps.version.outputs.VERSION }}.zip proagent-local-${{ steps.version.outputs.VERSION }}/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: proagent-local-${{ steps.version.outputs.VERSION }}
          path: pkg/proagent-local-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30

  package-server:
    name: Package Server Backend
    runs-on: ubuntu-latest
    needs: [compile-server, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "VERSION=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create package directory
        run: |
          mkdir -p pkg/proagent-server-${{ steps.version.outputs.VERSION }}
          cp -r server_backend pkg/proagent-server-${{ steps.version.outputs.VERSION }}/
          cp logging_config.py pkg/proagent-server-${{ steps.version.outputs.VERSION }}/
          cp scripts/start-server.sh pkg/proagent-server-${{ steps.version.outputs.VERSION }}/start.sh
          cp server_backend/requirements.txt pkg/proagent-server-${{ steps.version.outputs.VERSION }}/

      - name: Create zip artifact
        run: |
          cd pkg
          zip -r proagent-server-${{ steps.version.outputs.VERSION }}.zip proagent-server-${{ steps.version.outputs.VERSION }}/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: proagent-server-${{ steps.version.outputs.VERSION }}
          path: pkg/proagent-server-${{ steps.version.outputs.VERSION }}.zip
          retention-days: 30

  package-server-macos:
    name: Package Server Backend (macOS)
    runs-on: macos-latest
    needs: [test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Build server binary
        run: |
          python3 -m venv /tmp/srv-venv
          source /tmp/srv-venv/bin/activate
          pip install pyinstaller
          pip install -r server_backend/requirements.txt
          pyinstaller --onefile --name proagent-server-macos \
            --add-data "server_backend:server_backend" \
            --add-data "logging_config.py:." \
            --hidden-import passlib.handlers.bcrypt \
            scripts/server_backend.py

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: proagent-server-macos
          path: dist/proagent-server-macos
          retention-days: 30

  # ============================================================
  # 阶段四：生成文档 (Generate Docs)
  # ============================================================

  gen-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs: [compile-local, compile-server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_backend/requirements.txt
          pip install -r server_backend/requirements.txt
          pip install pdoc3

      - name: Generate docs for local_backend
        run: |
          PYTHONPATH=.:local_backend:local_backend/service/scraper:$PYTHONPATH \
            pdoc --html --output-dir docs/api/local local_backend --force --skip-errors

      - name: Generate docs for server_backend
        run: |
          PYTHONPATH=.:server_backend:$PYTHONPATH \
            pdoc --html --output-dir docs/api/server server_backend --force --skip-errors

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
          retention-days: 30

  # ============================================================
  # 阶段五：Docker 构建与测试
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-local, test-server, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build local backend image
        run: docker build -t proagent-local:latest -f Dockerfile.local .

      - name: Build server backend image
        run: docker build -t proagent-server:latest -f Dockerfile.server .

      - name: Build frontend image
        run: docker build -t proagent-frontend:latest -f Dockerfile.frontend .

  docker-test:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml build
          docker compose -f docker-compose.yml up -d
          echo "Waiting for services to start..."
          sleep 10
          docker compose -f docker-compose.yml ps

      - name: Health check - Server Backend
        run: |
          curl -sf http://localhost:8001/health && echo "Server OK" || {
            echo "Server health check failed"
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs server
            exit 1
          }

      - name: Health check - Local Backend
        run: |
          curl -sf http://localhost:8002/health && echo "Local OK" || {
            echo "Local health check failed"
            docker compose -f docker-compose.yml ps
            docker compose -f docker-compose.yml logs local
            exit 1
          }

      - name: Health check - Frontend
        run: |
          curl -sf http://localhost:8080/ && echo "Frontend OK" || { echo "Frontend health check failed"; docker compose -f docker-compose.yml logs frontend; exit 1; }

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down

  # ============================================================
  # 阶段六：Kubernetes
  # ============================================================

  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform -summary -strict -skip Kustomization k8s/

  k8s-test:
    name: Test on Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [k8s-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install kind
        run: |
          curl -sLo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/

      - name: Create kind cluster
        run: kind create cluster --name proagent-test

      - name: Rebuild images for kind
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/proagent-server:latest -f Dockerfile.server .
          docker build -t ghcr.io/${{ github.repository_owner }}/proagent-local:latest -f Dockerfile.local .
          docker build -t ghcr.io/${{ github.repository_owner }}/proagent-frontend:latest -f Dockerfile.frontend .

      - name: Verify images exist
        run: |
          docker images | grep proagent || echo "No proagent images found!"

      - name: Load images into kind
        run: |
          kind load docker-image ghcr.io/${{ github.repository_owner }}/proagent-server:latest --name proagent-test
          kind load docker-image ghcr.io/${{ github.repository_owner }}/proagent-local:latest --name proagent-test
          kind load docker-image ghcr.io/${{ github.repository_owner }}/proagent-frontend:latest --name proagent-test

      - name: Fix image registry in manifests
        run: |
          sed -i "s|ghcr.io/lsz-asd/|ghcr.io/${{ github.repository_owner }}/|g" k8s/deployment-*.yaml
          grep "image:" k8s/deployment-*.yaml

      - name: Deploy to kind
        run: |
          kubectl apply -k k8s/
          kubectl get all -n proagent

      - name: Wait for deployments
        run: |
          kubectl wait --for=condition=available --timeout=120s \
            deployment/proagent-server deployment/proagent-local \
            -n proagent
          kubectl wait --for=condition=available --timeout=120s \
            deployment/proagent-frontend \
            -n proagent

      - name: Health check
        run: |
          kubectl port-forward -n proagent svc/proagent-server 8001:8001 &
          kubectl port-forward -n proagent svc/proagent-local 8002:8002 &
          kubectl port-forward -n proagent svc/proagent-frontend 8080:80 &
          sleep 5

          curl -sf http://localhost:8001/health && echo "Server OK"
          curl -sf http://localhost:8002/health && echo "Local OK"
          curl -sf http://localhost:8080/ && echo "Frontend OK"

      - name: Show pod logs on failure
        if: failure()
        run: |
          kubectl describe pods -n proagent
          kubectl get events -n proagent
          kubectl logs -n proagent -l app=proagent-server --tail=50
          kubectl logs -n proagent -l app=proagent-local --tail=50

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name proagent-test

  # ============================================================
  # 阶段七：Tauri 桌面应用构建
  # ============================================================

  tauri-build:
    name: Build Tauri Desktop App (Linux)
    runs-on: ubuntu-22.04
    if: github.actor == 'lsz-asd'
    needs: [test-local, test-server, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build Python sidecar
        run: |
          pip install pyinstaller
          pip install -r local_backend/requirements.txt
          python3 scripts/build_sidecar.py

      - name: Generate icon
        run: python3 scripts/gen_icon.py

      - name: Build Tauri app
        run: |
          cd frontend
          npm run tauri:build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: proagent-linux-appimage
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: proagent-linux-deb
          path: frontend/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  tauri-build-windows:
    name: Build Tauri Desktop App (Windows)
    runs-on: windows-latest
    if: github.actor == 'lsz-asd'
    needs: [test-local, test-server, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Setup MSVC linker
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS path: $vs"
          $vc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "MSVC: $($vc.Name)"
          $linker = "$($vc.FullName)\bin\Hostx64\x64\link.exe"
          Write-Host "Linker: $linker"
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build Python sidecar
        run: |
          pip install pyinstaller
          pip install -r local_backend/requirements.txt
          python scripts/build_sidecar.py

      - name: Generate icon
        run: python scripts/gen_icon.py

      - name: Build Tauri app
        run: |
          cd frontend
          npm run tauri:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: proagent-windows-exe
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  tauri-build-macos:
    name: Build Tauri Desktop App (macOS)
    runs-on: macos-latest
    needs: [test-local, test-server, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Build Python sidecar
        run: |
          python3 -m venv /tmp/sidecar-venv
          source /tmp/sidecar-venv/bin/activate
          pip install pyinstaller
          pip install -r local_backend/requirements.txt
          python scripts/build_sidecar.py

      - name: Rename sidecar for Tauri
        run: |
          cd frontend/src-tauri/binaries
          for f in python-backend-*; do
            [ -f "$f" ] && ln -sf "$f" python-backend || true
          done
          for f in server-backend-*; do
            [ -f "$f" ] && ln -sf "$f" server-backend || true
          done
          ls -la

      - name: Generate icon
        run: python3 scripts/gen_icon.py

      - name: Build Tauri app
        run: |
          cd frontend
          npm run tauri:build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: proagent-macos-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
