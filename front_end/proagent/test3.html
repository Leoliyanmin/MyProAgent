<div id="test" style="width:100px; height:100px; background-color: red;">Test</div>
<script>
  try {
     const largeStr = "data:image/png;base64," + "A".repeat(3000000);
     document.documentElement.style.setProperty('--bg', `url("${largeStr}")`);
     document.getElementById('test').style.backgroundImage = `var(--bg, none)`;
     console.log('Success');
  } catch(e) {
     console.error(e);
  }
</script>
