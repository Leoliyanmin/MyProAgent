<!DOCTYPE html>
<html>
<body style="margin:0;">
<div id="test1" style="width:100px; height:100px; background-image: var(--img, none); background-color: blue;">Test 1</div>
<div id="test2" style="width:100px; height:100px; background-color: green;">Test 2</div>

<script>
const urlData = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='red'/></svg>";
document.documentElement.style.setProperty('--img', `url(${urlData})`);
document.getElementById('test2').style.backgroundImage = `url("${urlData}")`;
document.getElementById('test2').innerText = document.getElementById('test2').style.backgroundImage;
</script>
</body>
</html>
