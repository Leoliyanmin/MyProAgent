<!DOCTYPE html>
<html>
<body style="margin:0;">
<div id="app" style="width:100vw;height:100vh;background-color:var(--bg-color);background-image:var(--bg-image);background-size:cover;"></div>
<script>
const url = "data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'blue\'/></svg>";
document.documentElement.style.setProperty('--bg-color', 'red');
document.documentElement.style.setProperty('--bg-image', `url("${url}")`);
</script>
</body>
</html>
