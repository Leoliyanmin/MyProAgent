apiVersion: apps/v1
kind: Deployment
metadata:
  name: proagent-frontend
  namespace: proagent
  labels:
    app: proagent-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proagent-frontend
  template:
    metadata:
      labels:
        app: proagent-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/lsz-asd/proagent-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: proagent-frontend
  namespace: proagent
spec:
  selector:
    app: proagent-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
