apiVersion: apps/v1
kind: Deployment
metadata:
  name: proagent-frontend
  namespace: proagent
  labels:
    app: proagent-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proagent-frontend
  template:
    metadata:
      labels:
        app: proagent-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/lsz-asd/proagent-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: proagent-frontend
  namespace: proagent
spec:
  selector:
    app: proagent-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
